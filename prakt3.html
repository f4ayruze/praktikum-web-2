<!doctype html>
<html lang="en">

<body>

            <tr>
                <td>P002</td>
                <td>xray mobile</td>
                <td>Rp.170.000.000</td>
                <td><img src="xray mobile 2.jpg" width="145" height="150" alt="xray mobile"></td>
            </tr>
            <tr>
                <td>P003</td>
                <td>MRI</td>
                <td>Rp.70.000.0000.000</td>

            </tr>
        </tbody>
    </table>
</body>
</html>
